<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Prashan</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --navy: #050B1E;
            --violet: #7C3AED;
            --blue: #2563EB;
            --gold: #FBBF24;
            --success: #10B981;
        }
        body {
            background: linear-gradient(135deg, var(--navy) 0%, var(--violet) 50%, var(--blue) 100%);
            background-size: 200% 200%;
            animation: gradientShift 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding: 30px 0;
            font-family: 'Inter', sans-serif;
        }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

  .register-card {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(30px);
            border-radius: 32px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.4);
            overflow: hidden;
            animation: slideIn 0.6s ease;
            border: 1px solid rgba(255,255,255,0.2);
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }
  .card-header {
            background: transparent;
            color: var(--navy);
            padding: 45px 40px 20px;
            text-align: center;
            border: none;
        }
  .card-header.icon-box {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--violet), var(--blue));
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 2.2rem;
            color: white;
            box-shadow: 0 15px 40px rgba(124, 58, 237, 0.4);
        }
  .card-header h3 {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            font-weight: 900;
            font-size: 2rem;
            background: linear-gradient(90deg, var(--navy), var(--violet));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
  .card-header p { color: #64748B; font-weight: 500; }
  .card-body {
            padding: 30px 40px 45px;
        }
  .form-label {
            font-weight: 700;
            color: var(--navy);
            margin-bottom: 10px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
  .form-control,.form-select {
            border: 2px solid #E2E8F0;
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.3s;
            background: white;
        }
  .form-control:focus,.form-select:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 6px rgba(124, 58, 237, 0.1);
        }
  .input-group-text {
            background: #F8FAFC;
            border: 2px solid #E2E8F0;
            border-right: none;
            border-radius: 16px 0 0 16px;
            color: #94A3B8;
        }
  .input-group.form-control {
            border-left: none;
            border-radius: 0 16px 16px 0;
        }
  .password-wrapper {
            position: relative;
        }
  .toggle-password {
            position: absolute;
            right: 18px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #94A3B8;
            z-index: 10;
            font-size: 1.1rem;
        }
  .btn-otp {
            background: linear-gradient(135deg, var(--violet), var(--blue));
            border: none;
            color: white;
            font-weight: 700;
            border-radius: 0 16px 16px 0;
            padding: 0 22px;
            transition: all 0.3s;
        }
  .btn-otp:hover {
            opacity: 0.9;
            transform: scale(1.02);
        }
  .btn-otp:disabled {
            background: #CBD5E1;
            color: #64748B;
            cursor: not-allowed;
        }
  .otp-verified {
            color: var(--success);
            font-size: 0.85rem;
            margin-top: 8px;
            font-weight: 700;
            display: none;
        }
  .strength-bar {
            height: 6px;
            background: #E2E8F0;
            border-radius: 10px;
            margin-top: 10px;
            overflow: hidden;
        }
  .strength-fill {
            height: 100%;
            width: 0%;
            transition: all 0.3s ease;
            border-radius: 10px;
        }
  .btn-register {
            background: linear-gradient(135deg, var(--violet), var(--blue));
            border: none;
            color: white;
            padding: 16px;
            font-size: 1.1rem;
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            border-radius: 16px;
            width: 100%;
            transition: all 0.3s;
            box-shadow: 0 15px 40px rgba(124, 58, 237, 0.4);
        }
  .btn-register:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(124, 58, 237, 0.6);
        }
  .btn-register:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
  .login-link {
            text-align: center;
            margin-top: 25px;
            color: #64748B;
            font-weight: 500;
        }
  .login-link a {
            color: var(--violet);
            font-weight: 800;
            text-decoration: none;
        }
  .login-link a:hover { text-decoration: underline; }
  .required { color: #EF4444; }
  .alert {
            border-radius: 16px;
            border: none;
            font-weight: 600;
        }
        @media (max-width: 768px) {
    .card-body { padding: 25px; }
    .card-header { padding: 30px 25px 15px; }
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        emailjs.init("__vt3rSpl7DkoctBi");
    </script>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-7 col-md-9">
                <div class="register-card">
                    <div class="card-header">
                        <div class="icon-box"><i class="fas fa-shield-halved"></i></div>
                        <h3>Create Account</h3>
                        <p>Email OTP verification required</p>
                    </div>

                    <div class="card-body">
                        {% with messages = get_flashed_messages(with_categories=true) %}
                            {% if messages %}
                                {% for category, message in messages %}
                                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show mb-4" role="alert">
                                        <i class="fas fa-{{ 'check-circle' if category == 'success' else 'exclamation-circle' }} me-2"></i>
                                        {{ message }}
                                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                                    </div>
                                {% endfor %}
                            {% endif %}
                        {% endwith %}

                        <form method="POST" action="{{ url_for('register') }}" id="regForm" novalidate>
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                            <!-- Full Name -->
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-user"></i> Full Name <span class="required">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-user"></i></span>
                                    <input type="text" class="form-control" name="name" placeholder="Enter your full name" required>
                                </div>
                            </div>

                            <!-- Username -->
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-at"></i> Username <span class="required">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-at"></i></span>
                                    <input type="text" class="form-control" name="username" placeholder="Choose a username" required>
                                </div>
                            </div>

                            <!-- Mobile -->
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-phone"></i> Mobile Number <span class="required">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-phone"></i></span>
                                    <input type="tel" class="form-control" name="mobile" id="mobile" placeholder="10 digit number" pattern="[6-9][0-9]{9}" maxlength="10" required>
                                </div>
                            </div>

                            <!-- Email with OTP -->
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-envelope"></i> Email Address <span class="required">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                                    <input type="email" class="form-control" name="email" id="email" placeholder="your@email.com" required>
                                    <button type="button" class="btn btn-otp" id="sendEmailOtp">Send OTP</button>
                                </div>
                                <div class="otp-verified" id="emailVerified"><i class="fas fa-check-circle"></i>Email Verified</div>
                            </div>

                            <!-- Email OTP Input -->
                            <div class="mb-3" id="emailOtpBox" style="display:none;">
                                <label class="form-label"><i class="fas fa-key"></i> Email OTP <span class="required">*</span></label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="fas fa-key"></i></span>
                                    <input type="text" class="form-control" name="email_otp" id="emailOtp" placeholder="Enter 6 digit OTP" maxlength="6">
                                    <button type="button" class="btn btn-otp" id="verifyEmailOtp">Verify</button>
                                </div>
                            </div>

                            <!-- Password -->
                            <div class="mb-3">
                                <label class="form-label"><i class="fas fa-lock"></i> Password <span class="required">*</span></label>
                                <div class="password-wrapper">
                                    <input type="password" class="form-control" name="password" id="password" placeholder="Minimum 6 characters" minlength="6" required>
                                    <i class="fas fa-eye toggle-password" id="togglePass"></i>
                                </div>
                                <div class="strength-bar">
                                    <div class="strength-fill" id="strengthFill"></div>
                                </div>
                            </div>

                            <!-- State & District -->
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label"><i class="fas fa-map"></i> State <span class="required">*</span></label>
                                    <select class="form-select" name="state" id="state" required>
                                        <option value="">Select State</option>
                                        <option value="Maharashtra">Maharashtra</option>
                                        <option value="Delhi">Delhi</option>
                                        <option value="Karnataka">Karnataka</option>
                                        <option value="Gujarat">Gujarat</option>
                                        <option value="Rajasthan">Rajasthan</option>
                                        <option value="Uttar Pradesh">Uttar Pradesh</option>
                                        <option value="Bihar">Bihar</option>
                                        <option value="Tamil Nadu">Tamil Nadu</option>
                                        <option value="West Bengal">West Bengal</option>
                                        <option value="Madhya Pradesh">Madhya Pradesh</option>
                                        <option value="Andhra Pradesh">Andhra Pradesh</option>
                                        <option value="Telangana">Telangana</option>
                                        <option value="Kerala">Kerala</option>
                                        <option value="Punjab">Punjab</option>
                                        <option value="Haryana">Haryana</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label"><i class="fas fa-map-pin"></i> District <span class="required">*</span></label>
                                    <select class="form-select" name="district" id="district" required disabled>
                                        <option value="">First Select State</option>
                                    </select>
                                </div>
                            </div>

                            <input type="hidden" name="email_verified" id="emailVerifiedFlag" value="0">

                            <button type="submit" class="btn-register" id="registerBtn" disabled>
                                <i class="fas fa-user-plus me-2"></i>Register Now
                            </button>

                            <div class="login-link">
                                Already have an account? <a href="{{ url_for('login') }}">Login Here</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // All India States & Districts Data
        const stateDistricts = {
            'Maharashtra': ['Pune', 'Mumbai City', 'Mumbai Suburban', 'Nagpur', 'Nashik', 'Aurangabad', 'Solapur', 'Kolhapur', 'Satara', 'Thane'],
            'Karnataka': ['Bangalore Urban', 'Mysuru', 'Belagavi', 'Hubli', 'Mangalore'],
            'Delhi': ['Central Delhi', 'East Delhi', 'New Delhi', 'South Delhi', 'West Delhi'],
            'Gujarat': ['Ahmedabad', 'Surat', 'Vadodara', 'Rajkot', 'Gandhinagar'],
            'Rajasthan': ['Jaipur', 'Jodhpur', 'Udaipur', 'Kota', 'Ajmer'],
            'Uttar Pradesh': ['Lucknow', 'Kanpur', 'Agra', 'Varanasi', 'Meerut'],
            'Bihar': ['Patna', 'Gaya', 'Bhagalpur', 'Muzaffarpur'],
            'Tamil Nadu': ['Chennai', 'Coimbatore', 'Madurai', 'Salem'],
            'West Bengal': ['Kolkata', 'Howrah', 'Durgapur'],
            'Madhya Pradesh': ['Bhopal', 'Indore', 'Gwalior', 'Jabalpur'],
            'Andhra Pradesh': ['Visakhapatnam', 'Vijayawada', 'Guntur'],
            'Telangana': ['Hyderabad', 'Warangal'],
            'Kerala': ['Thiruvananthapuram', 'Kochi', 'Kozhikode'],
            'Punjab': ['Ludhiana', 'Amritsar', 'Jalandhar'],
            'Haryana': ['Gurugram', 'Faridabad', 'Panipat']
        };

        // State change event
        document.getElementById('state').addEventListener('change', function() {
            const districtSelect = document.getElementById('district');
            const selectedState = this.value;

            districtSelect.innerHTML = '<option value="">Select District</option>';

            if (selectedState && stateDistricts[selectedState]) {
                stateDistricts[selectedState].forEach(district => {
                    const option = document.createElement('option');
                    option.value = district;
                    option.textContent = district;
                    districtSelect.appendChild(option);
                });
                districtSelect.disabled = false;
            } else {
                districtSelect.disabled = true;
            }
        });

        // Show/Hide Password
        document.getElementById('togglePass').addEventListener('click', function() {
            const pass = document.getElementById('password');
            pass.type = pass.type === 'password'? 'text' : 'password';
            this.classList.toggle('fa-eye');
            this.classList.toggle('fa-eye-slash');
        });

        // Password Strength
        document.getElementById('password').addEventListener('input', function() {
            const val = this.value;
            const fill = document.getElementById('strengthFill');
            let strength = 0;
            if (val.length >= 6) strength += 20;
            if (val.length >= 10) strength += 20;
            if (/[a-z]/.test(val) && /[A-Z]/.test(val)) strength += 20;
            if (/\d/.test(val)) strength += 20;
            if (/[^a-zA-Z0-9]/.test(val)) strength += 20;
            fill.style.width = strength + '%';
            fill.style.background = strength <= 40? '#EF4444' : strength <= 60? '#F59E0B' : '#10B981';
        });

        // Email OTP Flow - EmailJS
        document.getElementById('sendEmailOtp').addEventListener('click', function() {
            const email = document.getElementById('email').value;
            const btn = this;

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert('Enter valid email address');
                return;
            }

            const otp = Math.floor(100000 + Math.random() * 900000);
            sessionStorage.setItem('email_otp', otp);
            sessionStorage.setItem('email_otp_email', email);

            btn.disabled = true;
            btn.textContent = 'Sending...';

            emailjs.send("service_a441io4", "template_avty214", {
                to_email: email,
                otp_code: otp,
                from_name: "Prashan"
            }).then(function(response) {
                document.getElementById('emailOtpBox').style.display = 'block';
                btn.textContent = 'Sent';
                alert('OTP sent to ' + email + '. Check Inbox & Spam folder.');
            }, function(error) {
                btn.disabled = false;
                btn.textContent = 'Send OTP';
                alert('Failed to send OTP: ' + error.text);
            });
        });

        document.getElementById('verifyEmailOtp').addEventListener('click', function() {
            const otp = document.getElementById('emailOtp').value;
            const email = document.getElementById('email').value;
            const storedOtp = sessionStorage.getItem('email_otp');
            const storedEmail = sessionStorage.getItem('email_otp_email');

            if (otp === storedOtp && email === storedEmail) {
                document.getElementById('emailVerified').style.display = 'block';
                document.getElementById('emailOtpBox').style.display = 'none';
                document.getElementById('emailVerifiedFlag').value = '1';
                sessionStorage.removeItem('email_otp');
                sessionStorage.removeItem('email_otp_email');
                checkAllVerified();
                alert('Email Verified Successfully!');
            } else {
                alert('Invalid OTP. Try again.');
            }
        });

        // Enable Register button only after Email verified
        function checkAllVerified() {
            const emailOk = document.getElementById('emailVerifiedFlag').value === '1';
            document.getElementById('registerBtn').disabled =!emailOk;
        }

        // Mobile digits only
        document.getElementById('mobile').addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '');
        });

        // Form validation
        document.getElementById('regForm').addEventListener('submit', function(e) {
            if (!this.checkValidity()) {
                e.preventDefault();
                e.stopPropagation();
            }
            this.classList.add('was-validated');
        });
    </script>
</body>
</html>
