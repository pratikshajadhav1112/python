{% extends "admin_base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
<h2><i class="fa-solid fa-gear me-2"></i>Settings</h2>

<div class="row">
    <!-- Left: Profile Info -->
    <div class="col-md-6">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <i class="fa fa-user"></i> Admin Profile
            </div>
            <div class="card-body">
                <p><b>Name:</b> {{ admin['name'] }}</p>
                <p><b>Email:</b> {{ admin['email'] }}</p>
                <p><b>Role:</b> <span class="badge bg-danger">Admin</span></p>
            </div>
        </div>
    </div>

    <!-- Right: Change Password -->
    <div class="col-md-6">
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-dark text-white">
                <i class="fa fa-key"></i> Change Password
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label>Old Password</label>
                        <input type="password" name="old_password" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>New Password</label>
                        <input type="password" name="new_password" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Password</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Full Width: Site Settings -->
    <div class="col-12">
        <div class="card shadow-sm">
            <div class="card-header bg-info text-white">
                <i class="fa fa-sliders"></i> Site Settings
            </div>
            <div class="card-body">
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="themeSwitch" checked>
                    <label class="form-check-label" for="themeSwitch">Blue + White Theme - Government Style</label>
                </div>
                <hr>
                <div class="mb-3">
                    <label>Site Name</label>
                    <input type="text" class="form-control" value="Leak Reporting Portal" readonly>
                </div>
                <button class="btn btn-success" disabled>Save Settings - Coming Soon</button>
            </div>
        </div>
    </div>
</div>
{% endblock %}
