{% extends "base.html" %}
{% block content %}
<div style="max-width: 800px; margin: 40px auto; padding: 0 20px;">
    <h1>Notifications</h1>
    {% for notif in notifications %}
    <div style="background: {% if notif.is_read %}white{% else %}#eff6ff{% endif %}; padding: 20px; margin: 10px 0; border-radius: 8px; border-left: 4px solid #3b82f6;">
        <p>{{ notif.message }}</p>
        <small style="color: #64748b;">{{ notif.created_at.strftime('%d %b %Y, %I:%M %p') }}</small>
    </div>
    {% else %}
    <p>No notifications</p>
    {% endfor %}
</div>
{% endblock %}
