{% extends "base.html" %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --navy: #050B1E;
    --violet: #7C3AED;
    --blue: #2563EB;
    --gold: #FBBF24;
    --success: #10B981;
  }

  body { font-family: 'Inter', sans-serif; background: linear-gradient(180deg, #F8FAFC 0%, #F1F5F9 100%); }

  .form-wrapper {
    max-width: 1000px;
    margin: 0 auto;
    padding: 50px 24px 120px;
  }

  /* ===== MAIN CARD - ANIMATED BORDER ===== */
.form-card {
    background: rgba(255, 255, 255, 0.8);
    backdrop-filter: blur(30px);
    border-radius: 40px;
    padding: 70px 60px;
    position: relative;
    box-shadow: 0 40px 100px -20px rgba(124, 58, 237, 0.3);
  }

  .prashan-form-20x .form-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 40px;
    padding: 3px;
    background: linear-gradient(90deg, var(--violet), var(--blue), var(--gold), var(--violet));
    background-size: 300% 300%;
    
    /* For Chrome/Safari */
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    
    /* For Firefox/Edge - Standard property */
    mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    mask-composite: exclude;
    
    animation: gradientRotate 4s linear infinite;
  }
  @keyframes gradientRotate { 0% { background-position: 0% 50%; } 100% { background-position: 100% 50%; } }

  /* ===== HEADER ===== */
.form-header { text-align: center; margin-bottom: 50px; }
.icon-3d {
    width: 100px;
    height: 100px;
    background: linear-gradient(135deg, var(--violet), var(--blue));
    border-radius: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0 auto 24px;
    font-size: 2.8rem;
    color: white;
    box-shadow: 0 20px 50px rgba(124, 58, 237, 0.4);
    animation: float3d 4s ease-in-out infinite;
  }
  @keyframes float3d { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
.form-header h2 {
    font-family: 'Outfit', sans-serif;
    font-size: 3rem;
    font-weight: 900;
    background: linear-gradient(90deg, var(--navy), var(--violet));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
  }
.subtitle { color: #64748B; font-size: 1.15rem; }

  /* ===== SECURITY PILL ===== */
.security-pill {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, rgba(16, 185, 129, 0.15), rgba(52, 211, 153, 0.15));
    color: #065F46;
    padding: 14px 28px;
    border-radius: 50px;
    font-weight: 700;
    border: 2px solid rgba(16, 185, 129, 0.3);
    margin-bottom: 45px;
  }

  /* ===== FORM ELEMENTS ===== */
.input-group-premium { position: relative; margin-bottom: 24px; }
.form-label {
    font-weight: 700;
    color: var(--navy);
    font-size: 0.9rem;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
.required-star { color: #EF4444; }
.form-control, .form-select {
    border-radius: 20px;
    border: 2px solid #E2E8F0;
    padding: 16px 20px;
    font-size: 1.05rem;
    background: white;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }
.form-control:focus, .form-select:focus {
    border-color: var(--violet);
    box-shadow: 0 0 0 6px rgba(124, 58, 237, 0.1), 0 10px 30px rgba(124, 58, 237, 0.15);
    transform: translateY(-3px);
  }
.input-icon {
    position: absolute;
    right: 18px;
    top: 48px;
    color: #94A3B8;
    transition: all 0.3s ease;
  }
.form-control:focus ~ .input-icon { color: var(--violet); transform: scale(1.2); }

.form-control[type="file"] {
    padding: 24px;
    background: linear-gradient(135deg, #F8FAFC, #F1F5F9);
    border: 2px dashed #CBD5E1;
    cursor: pointer;
  }
.form-control[type="file"]:hover {
    border-color: var(--violet);
    background: linear-gradient(135deg, #EEF2FF, #E0E7FF);
  }

  /* ===== SECTION ===== */
.section-title {
    font-family: 'Outfit', sans-serif;
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--navy);
    margin: 45px 0 25px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
.section-title i {
    width: 45px;
    height: 45px;
    background: linear-gradient(135deg, var(--violet), var(--blue));
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 1.3rem;
  }

  /* ===== AI BUTTONS ===== */
.ai-btn-group { display: flex; gap: 14px; flex-wrap: wrap; margin: 18px 0; }
.ai-btn {
    background: rgba(255,255,255,0.6);
    backdrop-filter: blur(10px);
    border: 2px solid;
    border-radius: 16px;
    padding: 12px 22px;
    font-weight: 700;
    transition: all 0.3s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }
.ai-btn:hover { transform: translateY(-4px) scale(1.05); box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
.btn-ai-improve { border-color: var(--violet); color: var(--violet); }
.btn-ai-improve:hover { background: var(--violet); color: white; }
.btn-ai-category { border-color: var(--success); color: var(--success); }
.btn-ai-category:hover { background: var(--success); color: white; }
.btn-ai-grammar { border-color: var(--gold); color: #92400E; }
.btn-ai-grammar:hover { background: var(--gold); color: var(--navy); }

  /* ===== AI OUTPUT ===== */
#ai_output {
    background: #F5F3FF;
    border-radius: 20px;
    padding: 20px;
    margin: 20px 0;
    border-left: 4px solid var(--violet);
    display: none;
    animation: slideDown 0.3s ease;
  }
  @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
#ai_text { background: white; padding: 16px; border-radius: 12px; margin: 12px 0; }
.btn-use-ai { background: var(--violet); color: white; border: none; border-radius: 12px; padding: 10px 20px; font-weight: 700; }

  /* ===== SUBMIT BUTTON ===== */
.btn-submit {
    background: linear-gradient(135deg, var(--violet), var(--blue));
    border: none;
    color: white;
    padding: 20px 32px;
    font-size: 1.2rem;
    font-weight: 900;
    border-radius: 20px;
    width: 100%;
    margin-top: 30px;
    font-family: 'Outfit', sans-serif;
    position: relative;
    overflow: hidden;
    box-shadow: 0 15px 50px rgba(124, 58, 237, 0.5);
    transition: all 0.3s ease;
  }
.btn-submit::before {
    content: '';
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    transition: left 0.5s ease;
  }
.btn-submit:hover::before { left: 100%; }
.btn-submit:hover { transform: translateY(-5px); box-shadow: 0 25px 70px rgba(124, 58, 237, 0.7); }

  /* ===== CHATBOT ===== */
.chat-toggle-btn {
    position: fixed; bottom: 35px; right: 35px; width: 70px; height: 70px;
    border-radius: 50%; background: linear-gradient(135deg, var(--violet), var(--blue));
    color: white; border: none; font-size: 1.8rem;
    box-shadow: 0 15px 50px rgba(124, 58, 237, 0.6);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { box-shadow: 0 15px 50px rgba(124, 58, 237, 0.6); } 50% { box-shadow: 0 15px 70px rgba(124, 58, 237, 0.9); } }
#chatbot-box {
    position: fixed; bottom: 110px; right: 35px; width: 380px;
    background: white; border-radius: 24px; display: none; z-index: 9999;
    box-shadow: 0 30px 80px rgba(0,0,0,0.2); border: 1px solid #E2E8F0;
  }

  @media (max-width: 768px) {
 .form-card { padding: 35px 25px; }
 .form-header h2 { font-size: 2rem; }
  }
</style>

<div class="form-wrapper">
  <div class="form-card">
    <!-- HEADER -->
    <div class="form-header">
      <div class="icon-3d"><i class="fas fa-shield-halved"></i></div>
      <h2>Report Exam Irregularity</h2>
      <p class="subtitle">Help ensure exam integrity. Anonymous & Secure reporting.</p>
    </div>

    <div class="text-center">
      <div class="security-pill"><i class="fas fa-lock"></i> Secure Data Handling</div>
    </div>

    <!-- FORM - BACKEND SAME -->
    <form method="POST" action="{{ url_for('submit_report') }}" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Row 1 -->
      <div class="row g-4">
        <div class="col-md-4">
          <div class="input-group-premium">
            <label class="form-label"><i class="fas fa-book"></i> Exam Name <span class="required-star">*</span></label>
            <input type="text" name="exam_name" class="form-control" placeholder="JEE Main, NEET" required>
            <i class="fas fa-book input-icon"></i>
          </div>
        </div>
        <div class="col-md-4">
          <div class="input-group-premium">
            <label class="form-label"><i class="fas fa-graduation-cap"></i> Subject <span class="required-star">*</span></label>
            <input type="text" name="subject_name" class="form-control" placeholder="Mathematics" required>
            <i class="fas fa-atom input-icon"></i>
          </div>
        </div>
        <div class="col-md-4">
          <div class="input-group-premium">
            <label class="form-label"><i class="fas fa-calendar"></i> Report Date</label>
            <input type="date" name="report_date" class="form-control" value="{{ today }}">
            <i class="fas fa-calendar input-icon"></i>
          </div>
        </div>
      </div>

      <!-- College -->
      <div class="input-group-premium">
        <label class="form-label"><i class="fas fa-building-columns"></i> College / Center <span class="required-star">*</span></label>
        <input type="text" name="college_name" class="form-control" placeholder="Full Institution Name" required>
        <i class="fas fa-building input-icon"></i>
      </div>

      <!-- Category -->
      <div class="input-group-premium">
        <label class="form-label"><i class="fas fa-tags"></i> Category</label>
        <select name="category" id="category" class="form-select">
          <option value="">🤖 Let AI Suggest</option>
          <option value="Cheating">Cheating</option>
          <option value="Paper Leak">Paper Leak</option>
          <option value="Invigilator Issue">Invigilator Issue</option>
          <option value="Technical Issue">Technical Issue</option>
          <option value="Harassment">Harassment</option>
          <option value="Other">Other</option>
        </select>
        <i class="fas fa-chevron-down input-icon"></i>
      </div>

      <!-- Location -->
      <div class="section-title"><i class="fas fa-location-dot"></i> Incident Location</div>
      <div class="row g-4">
        <div class="col-md-4">
          <div class="input-group-premium">
            <label class="form-label">State</label>
            <input type="text" name="incident_state" class="form-control" placeholder="Maharashtra">
            <i class="fas fa-map input-icon"></i>
          </div>
        </div>
        <div class="col-md-4">
          <div class="input-group-premium">
            <label class="form-label">District</label>
            <input type="text" name="incident_district" class="form-control" placeholder="Pune">
            <i class="fas fa-map-pin input-icon"></i>
          </div>
        </div>
        <div class="col-md-4">
          <div class="input-group-premium">
            <label class="form-label">City</label>
            <input type="text" name="incident_city" class="form-control" placeholder="Andheri">
            <i class="fas fa-city input-icon"></i>
          </div>
        </div>
      </div>

      <!-- Description -->
      <div class="section-title"><i class="fas fa-pen-to-square"></i> Describe the Incident</div>
      <div class="input-group-premium">
        <textarea name="description" id="description" class="form-control" rows="6" placeholder="Describe how and where you found the leak..."></textarea>
      </div>

      <div class="ai-btn-group">
        <button type="button" class="ai-btn btn-ai-improve" onclick="improveText()"><i class="fas fa-wand-magic-sparkles"></i> AI Improve</button>
        <button type="button" class="ai-btn btn-ai-category" onclick="suggestCategory()"><i class="fas fa-brain"></i> AI Category</button>
        <button type="button" class="ai-btn btn-ai-grammar" onclick="grammarCheck()"><i class="fas fa-spell-check"></i> Grammar</button>
      </div>

      <div id="ai_output">
        <b style="color: var(--violet);"><i class="fas fa-lightbulb"></i> AI Suggestion</b>
        <p id="ai_text"></p>
        <button type="button" class="btn-use-ai" onclick="useAIText()"><i class="fas fa-check"></i> Use This</button>
      </div>

      <!-- Evidence -->
      <div class="section-title"><i class="fas fa-paperclip"></i> Upload Evidence</div>
      <div class="input-group-premium">
        <input type="file" name="evidence" class="form-control" multiple accept="image/*,video/*,audio/*,.pdf">
        <small class="text-muted mt-2 d-block"><i class="fas fa-info-circle"></i> Images, Videos, PDF - Max 10MB each</small>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit">
        <i class="fas fa-paper-plane"></i> Submit Anonymously & Securely
      </button>
    </form>
  </div>
</div>

<!-- CHATBOT -->
<div id="chatbot-box">
  <div class="chat-header" style="background: linear-gradient(135deg, var(--violet), var(--blue)); color: white; padding: 16px 20px; border-radius: 24px 24px 0 0; font-weight: 700;">
    <i class="fas fa-robot me-2"></i>AI Assistant <span onclick="toggleChat()" style="float: right; cursor: pointer;">✕</span>
  </div>
  <div id="chat-messages" style="height: 220px; overflow-y: auto; padding: 16px; background: #F8FAFC;"></div>
  <div style="display: flex; padding: 12px; gap: 8px;">
    <input id="chat-input" type="text" placeholder="Ask me..." style="flex: 1; border: 2px solid #E2E8F0; border-radius: 12px; padding: 10px 14px;">
    <button onclick="sendChat()" style="background: var(--violet); color: white; border: none; border-radius: 12px; padding: 10px 16px;"><i class="fas fa-paper-plane"></i></button>
  </div>
</div>
<button onclick="toggleChat()" class="chat-toggle-btn"><i class="fas fa-comment-dots"></i></button>

<!-- JS - BACKEND SAME -->
<script>
  const csrfToken = "{{ csrf_token() }}";

  async function improveText() {
    let text = document.getElementById('description').value;
    if (!text) { alert("Please write description first."); return; }
    let res = await fetch('/ai_improve', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }, body: JSON.stringify({ text }) });
    let data = await res.json(); document.getElementById('ai_text').innerText = data.result; document.getElementById('ai_output').style.display = 'block';
  }
  async function suggestCategory() {
    let text = document.getElementById('description').value;
    if (!text) { alert("Please write description first."); return; }
    let res = await fetch('/ai_category', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }, body: JSON.stringify({ text }) });
    let data = await res.json(); document.getElementById('category').value = data.category;
  }
  async function grammarCheck() {
    let text = document.getElementById('description').value;
    if (!text) { alert("Please write description first."); return; }
    let res = await fetch('/ai_grammar', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }, body: JSON.stringify({ text }) });
    let data = await res.json(); document.getElementById('ai_text').innerText = data.result; document.getElementById('ai_output').style.display = 'block';
  }
  function useAIText() { document.getElementById('description').value = document.getElementById('ai_text').innerText; }
  function toggleChat() { const box = document.getElementById('chatbot-box'); box.style.display = box.style.display === 'none' ? 'block' : 'none'; }
  async function sendChat() {
    const input = document.getElementById('chat-input'); const msg = input.value.trim(); if (!msg) return;
    const messages = document.getElementById('chat-messages'); messages.innerHTML += `<div><b>You:</b> ${msg}</div>`; input.value = '';
    let res = await fetch('/chat', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken }, body: JSON.stringify({ message: msg }) });
    let data = await res.json(); messages.innerHTML += `<div><b>AI:</b> ${data.response}</div>`; messages.scrollTop = messages.scrollHeight;
  }
</script>

{% endblock %}
