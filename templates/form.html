{% extends "base.html" %}
{% block content %}
<!-- Modern, premium exam report form – all backend logic & names unchanged -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
  /* ===== PAGE WRAPPER ===== */
  .form-wrapper {
    max-width: 900px;
    margin: 0 auto;
    padding: 10px 0 30px;
  }

  /* ===== MAIN CARD – premium glass ===== */
  .form-card {
    background: rgba(255, 255, 255, 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 40px;
    padding: 50px 55px 48px;
    box-shadow: 0 20px 60px -16px rgba(18, 52, 86, 0.10), 0 6px 20px rgba(0, 0, 0, 0.02);
    border: 1px solid rgba(255, 255, 255, 0.5);
    transition: all 0.3s ease;
  }

  .form-card:hover {
    box-shadow: 0 28px 72px -20px rgba(18, 52, 86, 0.14);
  }

  /* ===== HEADER ===== */
  .form-header {
    text-align: center;
    margin-bottom: 32px;
    position: relative;
  }

  .form-header::after {
    content: '';
    position: absolute;
    bottom: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 4px;
    background: linear-gradient(90deg, #1a4b7a, #7bb3ff);
    border-radius: 10px;
  }

  .form-header h2 {
    font-size: 2.2rem;
    color: #0b1e2f;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 8px;
  }

  .form-header h2 i {
    color: #1a4b7a;
    margin-right: 12px;
    background: #ecf3fc;
    padding: 12px;
    border-radius: 20px;
    font-size: 1.8rem;
  }

  .subtitle {
    color: #56718e;
    font-size: 1rem;
    font-weight: 400;
    margin-top: 4px;
  }

  /* ===== SECURITY NOTE ===== */
  .security-note {
    background: linear-gradient(135deg, #ecf7f0, #dff0e6);
    color: #0b6b3a;
    padding: 14px 24px;
    border-radius: 60px;
    font-size: 0.9rem;
    font-weight: 600;
    margin-bottom: 32px;
    text-align: center;
    border: 1px solid rgba(11, 107, 58, 0.08);
    display: inline-block;
    width: 100%;
    letter-spacing: 0.3px;
  }

  .security-note i {
    margin-right: 10px;
    color: #0f8b4e;
  }

  /* ===== FORM ELEMENTS ===== */
  .form-label {
    font-weight: 600;
    color: #1a334a;
    font-size: 0.85rem;
    letter-spacing: 0.3px;
    margin-bottom: 6px;
  }

  .form-label .required-star {
    color: #dc3545;
    margin-left: 4px;
  }

  .form-control, .form-select {
    border-radius: 16px;
    border: 1.5px solid #e3ebf5;
    padding: 12px 18px;
    font-size: 0.95rem;
    background: #fafcff;
    transition: all 0.2s ease;
    color: #0b1e2f;
  }

  .form-control:focus, .form-select:focus {
    border-color: #1a4b7a;
    box-shadow: 0 0 0 4px rgba(26, 75, 122, 0.06);
    background: #ffffff;
  }

  .form-control::placeholder {
    color: #9bb1c7;
    font-weight: 400;
  }

  .form-control[type="file"] {
    padding: 14px 18px;
    background: #f7faff;
    border-style: dashed;
  }

  .form-control[type="file"]:hover {
    background: #f2f8ff;
    border-color: #7bb3ff;
  }

  textarea.form-control {
    min-height: 120px;
    resize: vertical;
  }

  /* ===== SECTION TITLE ===== */
  .section-title {
    font-size: 1.1rem;
    font-weight: 600;
    color: #0b1e2f;
    margin: 28px 0 18px 0;
    padding-bottom: 10px;
    border-bottom: 2px solid #eef4fa;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title i {
    color: #1a4b7a;
    font-size: 1.2rem;
  }

  /* ===== AI BUTTONS ===== */
  .ai-btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 12px 0 8px;
  }

  .ai-btn-group .btn {
    border-radius: 40px;
    padding: 8px 22px;
    font-weight: 600;
    font-size: 0.82rem;
    transition: all 0.2s ease;
    border-width: 1.5px;
  }

  .ai-btn-group .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.04);
  }

  .btn-ai-improve {
    background: #eaf3fc;
    color: #1a4b7a;
    border-color: #c6d9ed;
  }
  .btn-ai-improve:hover {
    background: #d7e6fc;
    border-color: #7bb3ff;
  }

  .btn-ai-category {
    background: #ecf8f0;
    color: #0b6b3a;
    border-color: #b8dfcb;
  }
  .btn-ai-category:hover {
    background: #ddf0e5;
    border-color: #6fc89a;
  }

  .btn-ai-grammar {
    background: #fef7ec;
    color: #9e6b2b;
    border-color: #f0ddbf;
  }
  .btn-ai-grammar:hover {
    background: #fdf0dc;
    border-color: #e6c084;
  }

  /* ===== AI OUTPUT BOX ===== */
  #ai_output {
    background: linear-gradient(135deg, #f0f6fe, #e8f0fa);
    border-radius: 20px;
    padding: 18px 22px;
    margin: 14px 0 10px;
    border: 1px solid #c6d9ed;
    display: none;
    animation: fadeSlide 0.3s ease;
  }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  #ai_output b {
    color: #1a4b7a;
    font-weight: 600;
  }

  #ai_text {
    margin: 8px 0 12px;
    padding: 12px 16px;
    background: white;
    border-radius: 14px;
    border-left: 4px solid #1a4b7a;
    color: #0b1e2f;
    font-size: 0.95rem;
    line-height: 1.6;
  }

  .btn-use-ai {
    border-radius: 40px;
    padding: 6px 24px;
    font-weight: 600;
    font-size: 0.8rem;
    background: #1a4b7a;
    color: white;
    border: none;
    transition: all 0.2s;
  }
  .btn-use-ai:hover {
    background: #0b2a4a;
    transform: scale(1.02);
    color: white;
  }

  /* ===== SUBMIT BUTTON ===== */
  .btn-submit {
    background: linear-gradient(135deg, #0b2a4a, #1a4b7a);
    border: none;
    color: white;
    padding: 16px 32px;
    font-size: 1.05rem;
    font-weight: 700;
    border-radius: 60px;
    width: 100%;
    transition: all 0.25s ease;
    box-shadow: 0 8px 28px -8px rgba(26, 75, 122, 0.25);
    letter-spacing: 0.4px;
    margin-top: 12px;
  }

  .btn-submit:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 40px -12px rgba(26, 75, 122, 0.35);
    color: white;
    background: linear-gradient(135deg, #0f2d4a, #1a4b7a);
  }

  .btn-submit i {
    margin-right: 12px;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 768px) {
    .form-card {
      padding: 30px 22px 32px;
      border-radius: 28px;
    }
    .form-header h2 {
      font-size: 1.6rem;
    }
    .form-header h2 i {
      padding: 8px;
      font-size: 1.4rem;
    }
    .security-note {
      font-size: 0.8rem;
      padding: 12px 16px;
    }
    .ai-btn-group .btn {
      font-size: 0.75rem;
      padding: 6px 16px;
    }
    .btn-submit {
      font-size: 0.95rem;
      padding: 14px 24px;
    }
  }

  @media (max-width: 480px) {
    .form-card {
      padding: 22px 14px 26px;
      border-radius: 22px;
    }
    .form-header h2 {
      font-size: 1.3rem;
    }
    .form-control, .form-select {
      padding: 10px 14px;
      font-size: 0.9rem;
    }
    .section-title {
      font-size: 1rem;
    }
  }

  /* ===== FLOATING CHATBOT (preserved) ===== */
  #chatbot-box {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 340px;
    background: white;
    border-radius: 24px;
    display: none;
    z-index: 9999;
    box-shadow: 0 20px 60px rgba(0, 20, 40, 0.15);
    border: 1px solid rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(8px);
    overflow: hidden;
  }

  #chatbot-box .chat-header {
    background: linear-gradient(135deg, #0b2a4a, #1a4b7a);
    color: white;
    padding: 14px 20px;
    font-weight: 600;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #chatbot-box .chat-header span {
    cursor: pointer;
    opacity: 0.8;
    transition: all 0.2s;
  }
  #chatbot-box .chat-header span:hover {
    opacity: 1;
  }

  #chat-messages {
    height: 200px;
    overflow-y: auto;
    padding: 14px 16px;
    font-size: 0.9rem;
    background: #f9fcff;
  }

  #chatbot-box .chat-input-row {
    display: flex;
    padding: 12px 14px;
    gap: 8px;
    background: white;
    border-top: 1px solid #eef4fa;
  }

  #chatbot-box .chat-input-row input {
    flex: 1;
    border: 1.5px solid #e3ebf5;
    border-radius: 40px;
    padding: 10px 16px;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  #chatbot-box .chat-input-row input:focus {
    border-color: #1a4b7a;
    outline: none;
    box-shadow: 0 0 0 4px rgba(26, 75, 122, 0.04);
  }

  .chat-toggle-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 9998;
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0b2a4a, #1a4b7a);
    color: white;
    border: none;
    font-size: 1.6rem;
    box-shadow: 0 8px 28px rgba(26, 75, 122, 0.3);
    transition: all 0.25s ease;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .chat-toggle-btn:hover {
    transform: scale(1.06);
    box-shadow: 0 12px 36px rgba(26, 75, 122, 0.35);
  }

  @media (max-width: 480px) {
    #chatbot-box {
      width: 290px;
      right: 10px;
      bottom: 10px;
    }
    .chat-toggle-btn {
      width: 52px;
      height: 52px;
      font-size: 1.3rem;
      right: 16px;
      bottom: 16px;
    }
  }
</style>

<div class="form-wrapper">
  <div class="form-card">
    <!-- HEADER -->
    <div class="form-header">
      <h2><i class="fas fa-shield-halved"></i> Report an Exam Leak</h2>
      <p class="subtitle">Your identity will remain anonymous. Help us maintain exam integrity.</p>
    </div>

    <!-- SECURITY NOTE -->
    <div class="security-note">
      <i class="fas fa-lock"></i> All submissions are encrypted &amp; 100% anonymous
    </div>

    <!-- ===== FORM – all names, IDs, CSRF untouched ===== -->
    <form method="POST" action="{{ url_for('submit_report') }}" enctype="multipart/form-data">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Row 1: Exam, Subject, Date -->
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Exam Name <span class="required-star">*</span></label>
          <input type="text" name="exam_name" class="form-control" placeholder="e.g. JEE Main" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Subject Name <span class="required-star">*</span></label>
          <input type="text" name="subject_name" class="form-control" placeholder="e.g. Mathematics" required>
        </div>
        <div class="col-md-4">
          <label class="form-label">Report Date</label>
          <input type="date" name="report_date" class="form-control" value="{{ today }}">
        </div>
      </div>

      <!-- College -->
      <div class="mt-3">
        <label class="form-label">College / Center Name <span class="required-star">*</span></label>
        <input type="text" name="college_name" class="form-control" placeholder="Full name of institution" required>
      </div>

      <!-- Category -->
      <div class="mt-3">
        <label class="form-label">Category</label>
        <select name="category" id="category" class="form-select">
          <option value="">AI will suggest or select</option>
          <option value="Cheating">Cheating</option>
          <option value="Paper Leak">Paper Leak</option>
          <option value="Invigilator Issue">Invigilator Issue</option>
          <option value="Technical Issue">Technical Issue</option>
          <option value="Harassment">Harassment</option>
          <option value="Other">Other</option>
        </select>
      </div>

      <!-- Incident Location -->
      <div class="section-title">
        <i class="fas fa-map-pin"></i> Incident Location
      </div>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">State</label>
          <input type="text" name="incident_state" class="form-control" placeholder="e.g. Maharashtra">
        </div>
        <div class="col-md-4">
          <label class="form-label">District</label>
          <input type="text" name="incident_district" class="form-control" placeholder="e.g. Mumbai">
        </div>
        <div class="col-md-4">
          <label class="form-label">City</label>
          <input type="text" name="incident_city" class="form-control" placeholder="e.g. Andheri">
        </div>
      </div>

      <!-- Description -->
      <div class="mt-4">
        <label class="form-label">Description of Incident</label>
        <textarea name="description" id="description" class="form-control" rows="5" placeholder="Describe how and where you found the leak..."></textarea>

        <!-- AI Action Buttons -->
        <div class="ai-btn-group">
          <button type="button" class="btn btn-ai-improve" onclick="improveText()">
            <i class="fas fa-magic"></i> Improve with AI
          </button>
          <button type="button" class="btn btn-ai-category" onclick="suggestCategory()">
            <i class="fas fa-tag"></i> Suggest Category
          </button>
          <button type="button" class="btn btn-ai-grammar" onclick="grammarCheck()">
            <i class="fas fa-spell-check"></i> Grammar Check
          </button>
        </div>

        <!-- AI Output Box -->
        <div id="ai_output">
          <b><i class="fas fa-lightbulb"></i> AI Suggestion</b>
          <p id="ai_text"></p>
          <button type="button" class="btn-use-ai" onclick="useAIText()">
            <i class="fas fa-check"></i> Use This Text
          </button>
        </div>
      </div>

      <!-- Evidence -->
      <div class="mt-3">
        <label class="form-label"><i class="fas fa-paperclip me-2"></i>Upload Evidence</label>
        <input type="file" name="evidence" class="form-control" multiple accept="image/*,video/*,audio/*,.pdf">
        <small class="text-muted" style="font-size: 0.8rem; margin-top: 6px; display: inline-block;">
          <i class="fas fa-info-circle"></i> Photos, Videos, Audio, PDF — Max 10MB per file
        </small>
      </div>

      <!-- Submit -->
      <button type="submit" class="btn-submit">
        <i class="fas fa-paper-plane"></i> Submit Report Anonymously
      </button>
    </form>
  </div>
</div>

<!-- ===== FLOATING CHATBOT (unchanged functionality) ===== -->
<div id="chatbot-box">
  <div class="chat-header">
    <span><i class="fas fa-robot me-2"></i>AI Assistant</span>
    <span onclick="toggleChat()" style="cursor:pointer; opacity:0.7;">✕</span>
  </div>
  <div id="chat-messages"></div>
  <div class="chat-input-row">
    <input id="chat-input" type="text" placeholder="Ask me..." onkeypress="if(event.key==='Enter') sendChat();">
    <button onclick="sendChat()" class="btn btn-primary" style="border-radius:40px; padding:8px 20px; font-weight:600; background:#1a4b7a; border:none;">
      <i class="fas fa-paper-plane"></i>
    </button>
  </div>
</div>
<button onclick="toggleChat()" class="chat-toggle-btn" aria-label="Toggle chat assistant">
  <i class="fas fa-comment-dots"></i>
</button>

<!-- ===== JAVASCRIPT (all backend logic & CSRF untouched) ===== -->
<script>
  // CSRF token – preserved exactly as in original
  const csrfToken = "{{ csrf_token() }}";

  // ===== AI Functions =====
  async function improveText() {
    let text = document.getElementById('description').value;
    if (!text) { alert("Please write a description first."); return; }
    let res = await fetch('/ai_improve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
      body: JSON.stringify({ text })
    });
    let data = await res.json();
    document.getElementById('ai_text').innerText = data.result;
    document.getElementById('ai_output').style.display = 'block';
  }

  async function suggestCategory() {
    let text = document.getElementById('description').value;
    if (!text) { alert("Please write a description first."); return; }
    let res = await fetch('/ai_category', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
      body: JSON.stringify({ text })
    });
    let data = await res.json();
    document.getElementById('category').value = data.category;
  }

  async function grammarCheck() {
    let text = document.getElementById('description').value;
    if (!text) { alert("Please write a description first."); return; }
    let res = await fetch('/ai_grammar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
      body: JSON.stringify({ text })
    });
    let data = await res.json();
    document.getElementById('ai_text').innerText = data.result;
    document.getElementById('ai_output').style.display = 'block';
  }

  function useAIText() {
    document.getElementById('description').value = document.getElementById('ai_text').innerText;
  }

  // ===== Chatbot (preserved) =====
  function toggleChat() {
    const box = document.getElementById('chatbot-box');
    box.style.display = box.style.display === 'none' ? 'block' : 'none';
  }

  async function sendChat() {
    const input = document.getElementById('chat-input');
    const msg = input.value.trim();
    if (!msg) return;
    const messages = document.getElementById('chat-messages');
    messages.innerHTML += `<div><b>You:</b> ${msg}</div>`;
    input.value = '';

    try {
      let res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
        body: JSON.stringify({ message: msg })
      });
      let data = await res.json();
      messages.innerHTML += `<div><b>AI:</b> ${data.response}</div>`;
      messages.scrollTop = messages.scrollHeight;
    } catch (e) {
      messages.innerHTML += `<div><b>AI:</b> Sorry, something went wrong.</div>`;
    }
  }
</script>
{% endblock %}
