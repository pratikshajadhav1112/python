{% extends "base.html" %}
{% block content %}
<div class="container">
    <h2>Report an Exam Leak</h2>
    <p class="subtitle">Your identity will remain anonymous. Help us maintain exam integrity.</p>

    <form class="report-form" method="POST" action="{{ url_for('submit') }}">
        <div class="form-group">
            <label for="exam_name">Exam Name *</label>
            <input type="text" id="exam_name" name="exam_name" required 
                   
        </div>

        <div class="form-group">
            <label for="subject_name">Subject Name *</label>
            <input type="text" id="subject_name" name="subject_name" required
                
        </div>

        <div class="form-group">
            <label for="college_name">College Name *</label>
            <input type="text" id="college_name" name="college_name" required
                   
        </div>

        <div class="form-group">
            <label for="status">Status *</label>
            <select id="status" name="status" required>
                <option value="">Select Status</option>
                <option value="Pending">Pending</option>
                <option value="Investigating">Investigating</option>
                <option value="Resolved">Resolved</option>
            </select>
        </div>

        <div class="form-group">
            <label for="report_date">Report Date *</label>
            <input type="date" id="report_date" name="report_date" required>
        </div>

        <div class="form-group">
            <label for="description">Leak Details *</label>
            <textarea id="description" name="description" rows="5" required
                      placeholder="Describe how/where you found the leak..."></textarea>
        </div>

        <button type="submit" class="btn btn-primary">Submit Report Anonymously</button>
    </form>
</div>
{% endblock %}
