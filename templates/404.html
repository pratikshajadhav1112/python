{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
.error-wrapper {
    min-height: 80vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f8fafc;
    padding: 20px;
}
.error-card {
    background: white;
    border-radius: 20px;
    padding: 50px 40px;
    text-align: center;
    box-shadow: 0 10px 40px rgba(0,0,0,0.08);
    max-width: 500px;
    width: 100%;
    border: 1px solid #e2e8f0;
}
.error-code {
    font-size: 8rem;
    font-weight: 900;
    color: #1e3a8a;
    line-height: 1;
    margin-bottom: 10px;
    text-shadow: 3px 3px 0px #dbeafe;
}
.error-title {
    font-size: 1.8rem;
    font-weight: 700;
    color: #1e293b;
    margin-bottom: 15px;
}
.error-text {
    color: #64748b;
    font-size: 1.1rem;
    margin-bottom: 30px;
}
.btn-home {
    background: #1e3a8a;
    color: white;
    padding: 12px 30px;
    border-radius: 10px;
    font-weight: 600;
    text-decoration: none;
    display: inline-block;
    transition: all 0.3s;
}
.btn-home:hover {
    background: #1e40af;
    transform: translateY(-2px);
    color: white;
}
.error-icon {
    font-size: 4rem;
    color: #cbd5e1;
    margin-bottom: 20px;
}
</style>

<div class="error-wrapper">
    <div class="error-card">
        <i class="fas fa-unlink error-icon"></i>
        <div class="error-code">404</div>
        <h2 class="error-title">Page Not Found</h2>
        <p class="error-text">
            Oops! The page you're looking for doesn't exist.<br>
            It might have been moved or deleted.
        </p>
        <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('index') }}" class="btn-home">
            <i class="fas fa-home"></i> Go to Homepage
        </a>
        <div style="margin-top: 20px;">
            <a href="{{ url_for('report_list') }}" class="text-muted">
                <i class="fas fa-arrow-left"></i> Back to Reports
            </a>
        </div>
    </div>
</div>
{% endblock %}
