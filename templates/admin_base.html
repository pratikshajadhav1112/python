<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Admin Panel{% endblock %} - Exam Platform</title>

    <!-- Bootstrap 5 + Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --gov-blue: #0d47a1;
            --gov-blue-light: #1565c0;
            --bg-light: #f4f6f9;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-light);
        }
       .sidebar {
            min-height: 100vh;
            background: linear-gradient(180deg, var(--gov-blue) 0%, #08306b 100%);
            color: white;
            position: fixed;
            width: 260px;
            transition: all 0.3s;
        }
       .sidebar.nav-link {
            color: rgba(255,255,255,0.85);
            padding: 12px 20px;
            margin: 4px 10px;
            border-radius: 8px;
            font-weight: 500;
        }
       .sidebar.nav-link:hover,.sidebar.nav-link.active {
            background: var(--gov-blue-light);
            color: white;
        }
       .main-content { margin-left: 260px; padding: 25px; }
       .card {
            border: none;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
       .card:hover { transform: translateY(-5px); }
       .stat-card h2 { font-weight: 700; font-size: 2rem; }
       .navbar-top { background: white; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        @media (max-width: 768px) {
           .sidebar { margin-left: -260px; }
           .main-content { margin-left: 0; }
        }
    </style>
</head>
<body>

<div class="d-flex">
    <!-- 📋 Sidebar -->
    <nav class="sidebar p-3">
        <h4 class="text-center mb-4"><i class="bi bi-shield-check"></i> Exam Admin</h4>
        <ul class="nav flex-column">
            <li><a class="nav-link {% if request.endpoint == 'admin_dashboard' %}active{% endif %}" href="{{ url_for('admin_dashboard') }}"><i class="bi bi-house-door me-2"></i> Dashboard</a></li>
            <li><a class="nav-link" href="{{ url_for('admin_users') }}"><i class="bi bi-people me-2"></i> Manage Users</a></li>
            <li><a class="nav-link" href="{{ url_for('admin_reports') }}"><i class="bi bi-file-text me-2"></i> Manage Reports</a></li>
            <li><a class="nav-link" href="#"><i class="bi bi-folder me-2"></i> Evidence Files</a></li>
            <li><a class="nav-link" href="#"><i class="bi bi-bell me-2"></i> Notifications</a></li>
            <li><a class="nav-link" href="#"><i class="bi bi-bar-chart me-2"></i> Analytics</a></li>
            <li><a class="nav-link" href="#"><i class="bi bi-gear me-2"></i> Settings</a></li>
            <li><a class="nav-link text-danger bg-white mt-3" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right me-2"></i> Logout</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="main-content w-100">
        <!-- Top Navbar -->
        <div class="navbar-top p-3 mb-4 d-flex justify-content-between align-items-center">
            <h5 class="mb-0 fw-bold text-primary">{% block page_title %}Dashboard{% endblock %}</h5>
            <div>Welcome, <b>{{ user.name }}</b></div>
        </div>

        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
